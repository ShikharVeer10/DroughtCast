# Canonical DroughtCast architecture (exact diagram settings).
# All Phase-2 optional upgrades are OFF here.
experiment:
  name: "DroughtCast base diagram"
  seed: 42

sites:
  aurangabad: {lat: 19.8762, lon: 75.3433, region: Marathwada}
  latur: {lat: 18.4088, lon: 76.5604, region: Marathwada}
  beed: {lat: 18.9891, lon: 75.7601, region: Marathwada}
  nanded: {lat: 19.1383, lon: 77.3210, region: Marathwada}
  nagpur: {lat: 21.1458, lon: 79.0882, region: Vidarbha}
  akola: {lat: 20.7002, lon: 77.0082, region: Vidarbha}
  amravati: {lat: 20.9374, lon: 77.7796, region: Vidarbha}
  pune: {lat: 18.5204, lon: 73.8567, region: Madhya_Maharashtra}
  solapur: {lat: 17.6599, lon: 75.9064, region: Madhya_Maharashtra}
  nashik: {lat: 19.9975, lon: 73.7898, region: Madhya_Maharashtra}
  mumbai: {lat: 19.0760, lon: 72.8777, region: Konkan}
  ratnagiri: {lat: 16.9902, lon: 73.3120, region: Konkan}

data:
  path: "data/maharashtra/monthly_sites.csv"
  site_filter: [akola, amravati, aurangabad, beed, latur, mumbai, nagpur, nanded, nashik, pune, ratnagiri, solapur]
  metadata_path: "data/meta.json"
  start_year: 1981
  end_year: 2024
  features: [PRECTOTCORR, T2M, T2MDEW, WS10M, ALLSKY_SFC_SW_DWN, oni, dmi, nao, pdo, spei_3_obs, spei_6_obs, spei_12_obs]
  seq_len: 6
  forecast_steps: 4

model:
  hidden_dim_1: 64
  hidden_dim_2: 32
  dropout: 0.2
  encoder: lstm
  attention: shared
  heads: direct
  use_cascaded_decoder: false
  variable_gate: false
  separate_encoders: false
  static_context: false
  input_extras: []
  consistency_weight: 0.0
  # quantiles: omitted => point output

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 12
  lr_patience: 5
  extreme_weight: 1.0
  checkpoint_dir: checkpoints
  loss: mse
  task_weighting: fixed
