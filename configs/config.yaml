experiment:
  name: "DroughtCast multi-scale SPEI forecasting"
  seed: 42

sites:
  guntur: {lat: 15.9129, lon: 79.74, region: south_asia}
  jaipur: {lat: 26.9124, lon: 75.7873, region: south_asia}
  nagpur: {lat: 21.1458, lon: 79.0882, region: south_asia}
  murray_darling: {lat: -34.0, lon: 143.0, region: australia}
  addis_ababa: {lat: 9.03, lon: 38.74, region: east_africa}
  phoenix: {lat: 33.4484, lon: -112.074, region: us_southwest}
  seville: {lat: 37.3891, lon: -5.9845, region: mediterranean}
  pretoria: {lat: -25.7479, lon: 28.2293, region: southern_africa}

data:
  path: "data/monthly_sites.csv"
  metadata_path: "data/meta.json"
  start_year: 1981
  end_year: 2024
  features: [PRECTOTCORR, T2M, T2MDEW, WS10M, ALLSKY_SFC_SW_DWN, oni, dmi, nao, pdo, spei_3_obs, spei_6_obs, spei_12_obs]
  seq_len: 6
  forecast_steps: 4
  # input_dim is inferred from features when loading the dataset.

model:
  input_dim: 12                  # Phase 1: 12 climate & ocean variables (T-6 to T-1)
  hidden_dim: 64                 # Phase 2: LSTM Layer 1 hidden units (64)
  out_hidden_dim: 32             # Phase 2: LSTM Layer 2 hidden units (32) -> Context vector c in R^32
  num_layers: 2
  dropout: 0.2
  spei3_dropout: 0.35            # Prevents SPEI-3 validation MAE divergence
  forecast_steps: 1              # Set to 4 for simultaneous [T+1, T+2, T+3, T+4] output per head
  num_quantiles: 1
  use_teleconnection_gate: false # Ablation Toggle B
  use_multi_horizon_attn: false  # Ablation Toggle C
  use_cascade_decoder: false     # Ablation Toggle D 




training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 12
  lr_patience: 5
  extreme_weight: 1.0
  checkpoint_dir: checkpoints
